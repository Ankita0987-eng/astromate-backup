name: cosmic_match
description: Cosmic Match - Astrology Dating & Compatibility App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5
  firebase_messaging: ^15.2.5

  # Auth
  google_sign_in: ^6.3.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation & config
  go_router: ^14.8.1
  flutter_dotenv: ^5.2.1

  # UI
  google_fonts: ^6.2.1
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  percent_indicator: ^4.2.4
  fl_chart: ^0.70.2
  flutter_markdown: ^0.7.6+2
  cached_network_image: ^3.4.1

  # Networking
  http: ^1.3.0

  # Monetization & ads
  in_app_purchase: ^3.2.1
  google_mobile_ads: ^5.3.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  equatable: ^2.0.7
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/lottie/
    - assets/images/
    - .env
    - .env.example
